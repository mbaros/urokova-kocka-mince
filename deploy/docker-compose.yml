# Úroková kočka on martin1 — one image, one container per INSTANCE (see docs/instances/).
# Caddy (container qa-tracker-caddy, config /home/bobek/jarabot-metrics/Caddyfile) routes each
# instance's secret path to its container — see deploy/Caddyfile.snippet. Progress lives in
# ./data-<instance> on the host (gitignored); the priming video is shared from ./data/video.
x-kocka: &kocka
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: urokova-kocka:latest
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  environment:
    DATA_DIR: /data
    VIDEO_DIR: /video
  networks:
    - caddy
  mem_limit: 256m
  cpus: 0.5

services:
  kocka:                      # instance "terezka" (the original)
    <<: *kocka
    container_name: kocka
    volumes:
      - ../data:/data
      - ../data/video:/video:ro

  kocka-martas:               # instance "martas"
    <<: *kocka
    container_name: kocka-martas
    volumes:
      - ../data-martas:/data
      - ../data/video:/video:ro

networks:
  caddy:
    external: true
    name: jarabot-metrics_default
